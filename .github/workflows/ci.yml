name: Pipeline de Integración y Despliegue Continuo (CI/CD Quality Gate)

on:
  push:
    branches: [ main, master, external, feat/* ]
  pull_request:
    branches: [ main, master, external ]

jobs:
  # ============================================================================
  # JOB 1: AUDITORÍA ESTÁTICA Y DE SEGURIDAD DEL CÓDIGO (ISO 5055)
  # ============================================================================
  auditoria-codigo:
    name: 1. Auditoría Estática de Código (Flake8 & Standards)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Herramientas de Auditoría
        run: |
          python -m pip install --upgrade pip
          pip install flake8 radon

      - name: Auditoría de Errores Fatales de Sintaxis
        run: |
          # Falla si existen errores de sintaxis, variables no definidas o imports rotos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Quality Gate de Estilo y Complejidad Ciclomática Estricta (ISO 5055)
        run: |
          # Reglas PEP8 e ISO 25010/5055: complejidad ciclomática <= 12, líneas <= 120
          flake8 . --count --max-complexity=12 --max-line-length=120 --statistics

  # ============================================================================
  # JOB 2: PRUEBAS UNITARIAS, COBERTURA (>= 80%) Y AUDITORÍA GQM (ISO 25010)
  # ============================================================================
  pruebas-unitarias:
    name: 2. Pruebas Unitarias, Cobertura (>= 80%) y Auditoría GQM
    runs-on: ubuntu-latest
    needs: auditoria-codigo

    steps:
      - name: Descargar Repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema y Testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar Pruebas Unitarias con Medición de Cobertura en src/
        run: |
          python -m coverage run --source=src -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage json -o coverage.json

      - name: Verificar Quality Gate de Cobertura (Min 80% en todo src/)
        run: |
          python -m coverage report --fail-under=80 -m

      - name: Ejecutar Auditoría Cuantitativa de Calidad ISO/IEC 25010 (GQM)
        run: |
          python scripts/run_quality_audit.py

      - name: Subir Informes de Calidad y Cobertura como Artefactos de CI
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad-iso25010
          path: |
            coverage.json
            data/quality/last_audit.json
            outputs/quality/test_run.json
          retention-days: 14

  # ============================================================================
  # JOB 3: DESPLIEGUE CONTINUO (CD) A LA NUBE (RENDER)
  # ============================================================================
  despliegue-produccion:
    name: 3. Despliegue Continuo a Producción (Render)
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar Despliegue Automático tras Quality Gate Aprobado
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Quality Gate Aprobado. Disparando despliegue en Render..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Despliegue solicitado exitosamente a Render."
          else
            echo "Aviso: RENDER_DEPLOY_HOOK no configurado en Secrets. Despliegue manual o omitido."
          fi
