name: Pipeline de Integración y Despliegue Continuo (CI/CD Quality Gate)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: AUDITORÍA ESTÁTICA Y DE SEGURIDAD DEL CÓDIGO
  # ============================================================================
  auditoria-codigo:
    name: 1. Auditoría Estática de Código (Flake8 & Standards)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Herramientas de Auditoría
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Auditoría de Errores Fatales de Sintaxis
        run: |
          # Conserva el resultado como evidencia y falla si existen errores críticos.
          mkdir -p quality-results
          set +e
          flake8 . --select=E9,F63,F7,F82 --format='%(code)s:%(path)s:%(row)d:%(col)d:%(text)s' > quality-results/flake8_critical.txt
          flake8_exit=$?
          set -e
          cat quality-results/flake8_critical.txt
          test "$flake8_exit" -eq 0

      - name: Auditoría de Estilo y Complejidad Ciclomática (Warning)
        run: |
          # Reglas de estilo PEP8 e ISO 25010 (complejidad max 12, lineas max 120)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

  # ============================================================================
  # JOB 2: PRUEBAS UNITARIAS Y QUALITY GATE DE COBERTURA (>= 80%)
  # ============================================================================
  pruebas-unitarias:
    name: 2. Pruebas Unitarias y Cobertura (Min 80%)
    runs-on: ubuntu-latest
    needs: auditoria-codigo

    steps:
      - name: Descargar Repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema y Testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pruebas Unitarias con Medición de Cobertura
        run: |
          python -m coverage run --source=src/services -m unittest discover -s tests -p "test_*.py" -v

      - name: Verificar Umbral Mínimo de Cobertura (80% Requerido)
        run: |
          # Falla el pipeline si la cobertura del código es inferior al 80%
          python -m coverage report --fail-under=80 -m

      - name: Generar evidencia de calidad del pipeline
        run: |
          mkdir -p quality-results
          python -m coverage json -o quality-results/coverage.json
          if [ ! -f quality-results/flake8_critical.txt ]; then
            flake8 . --select=E9,F63,F7,F82 --format='%(code)s:%(path)s:%(row)d:%(col)d:%(text)s' > quality-results/flake8_critical.txt
          fi
          python scripts/build_quality_evidence.py \
            --coverage quality-results/coverage.json \
            --flake8-critical quality-results/flake8_critical.txt \
            --output quality-results/ci_quality_metrics.json \
            --commit "$GITHUB_SHA"
          cat quality-results/ci_quality_metrics.json

      - name: Publicar resumen de calidad
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("quality-results/ci_quality_metrics.json", encoding="utf-8"))
          print("## ISO/IEC 25000 quality evidence")
          print("| Indicator | Value | Target |")
          print("|---|---:|---:|")
          for item in report["metrics"]:
              print(f"| {item['id']} | {item['value']} {item['unit']} | {item['target']} |")
          PY

      - name: Conservar evidencia de calidad
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: quality-results/
          if-no-files-found: error

  # ============================================================================
  # JOB 3: DESPLIEGUE CONTINUO (CD) A LA NUBE (RENDER)
  # ============================================================================
  despliegue-produccion:
    name: 3. Despliegue Continuo a Producción (Render)
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar Despliegue Automático tras Quality Gate
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Quality Gate Aprobado. Disparando despliegue en Render..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Despliegue solicitado exitosamente a Render."
          else
            echo "Aviso: RENDER_DEPLOY_HOOK no configurado en Secrets. Despliegue manual o omitido."
          fi
